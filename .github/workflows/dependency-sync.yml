name: Kult Ecosystem Dependency Sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dependency-sync.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-package-published]

permissions:
  contents: write

concurrency:
  group: ecosystem-dependency-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Sync published upstream package versions
        id: updates
        shell: bash
        run: |
          set -euo pipefail
          npx --yes npm-check-updates@latest --upgrade --filter '@dinilmusick/gutts,@ultrst-armada/krnl,@ultrst-armada/frnlts,@ultrst-armada/kloks,@ultrst-armada/floks'
          if git diff --quiet -- package.json ':(glob)**/package.json'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies and refresh lockfile
        if: steps.updates.outputs.changed == 'true'
        run: pnpm install --no-frozen-lockfile
      - name: Build
        if: steps.updates.outputs.changed == 'true'
        run: pnpm run build
      - name: Typecheck
        if: steps.updates.outputs.changed == 'true'
        run: pnpm run lint
      - name: Test
        if: steps.updates.outputs.changed == 'true'
        run: pnpm run test
      - name: Commit validated dependency updates
        if: steps.updates.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A package.json ':(glob)**/package.json' pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency updates to commit."
            exit 0
          fi
          git commit -m "chore(deps): sync verified upstream packages [skip ci]"
          git push origin HEAD:main
