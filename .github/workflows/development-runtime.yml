name: Development Runtime

on:
  workflow_dispatch:
    inputs:
      task:
        description: Canonical development task
        required: true
        type: choice
        options:
          - install
          - lint
          - test
          - build
          - validate

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Execute canonical development task
        env:
          TASK: ${{ inputs.task }}
        run: |
          case "$TASK" in
            install) pnpm install --no-frozen-lockfile ;;
            lint) pnpm lint ;;
            test) pnpm test ;;
            build) pnpm build ;;
            validate) pnpm lint && pnpm test && pnpm build ;;
            *) echo "Unsupported development task: $TASK" >&2; exit 2 ;;
          esac
