name: Worker Environment Contract

on:
  pull_request:
    paths:
      - "wrangler.toml"
      - "src/backend/**"
      - "src/server/**"
      - "server.ts"
      - ".github/workflows/worker-environment-contract.yml"
  push:
    branches: [main]
    paths:
      - "wrangler.toml"
      - "src/backend/**"
      - "src/server/**"
      - "server.ts"
      - ".github/workflows/worker-environment-contract.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate minimal Worker environment contract
        run: |
          python - <<'PY'
          import pathlib
          import re
          import tomllib

          config = tomllib.loads(pathlib.Path("wrangler.toml").read_text())
          variables = config.get("vars", {})
          allowed = {"DEPM_GATEWAY_DOMAIN"} if pathlib.Path("package.json").exists() and '"name": "depm-engine"' in pathlib.Path("package.json").read_text() else set()
          assert set(variables) <= allowed, f"Unexpected Worker vars: {sorted(set(variables) - allowed)}"
          raw = pathlib.Path("wrangler.toml").read_text()
          assert "SYSTEM_DATABASE_URL_1" in raw
          assert "SYSTEM_DATABASE_URL_2" in raw
          assert "SYSTEM_DATABASE_URL_3" in raw
          assert "postgresql://" not in raw, "Database connection strings must not be committed"
          package = pathlib.Path("package.json").read_text() if pathlib.Path("package.json").exists() else ""
          allowed_env = {"SYSTEM_DATABASE_URL_1", "SYSTEM_DATABASE_URL_2", "SYSTEM_DATABASE_URL_3"}
          if '"name": "depm-engine"' in package:
              allowed_env.add("DEPM_GATEWAY_DOMAIN")
          runtime_files = []
          for root in (pathlib.Path("src/backend"), pathlib.Path("src/server")):
              if root.exists():
                  runtime_files.extend(p for p in root.rglob("*") if p.suffix in {".ts", ".tsx", ".js", ".mjs", ".cjs"})
          if pathlib.Path("server.ts").exists():
              runtime_files.append(pathlib.Path("server.ts"))
          for source_path in runtime_files:
              source = source_path.read_text()
              for variable in re.findall(r"process\.env\.([A-Z][A-Z0-9_]*)", source):
                  assert variable in allowed_env, f"{source_path} reads forbidden environment variable: {variable}"
              assert not re.search(r"process\.env\s*\[", source), f"{source_path} uses dynamic environment-variable access"
          print("Worker and runtime environment contract passed.")
          PY
